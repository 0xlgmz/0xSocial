services:
  # ==========
  # POSTGRES
  # ==========
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432" 
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ==========
  # MIGRATIONS
  # ==========
  migrate:
    build:
      context: .
      dockerfile: deployment/goose/Dockerfile
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: host=db port=5432 sslmode=disable
      GOOSE_MIGRATION_DIR: /migrations
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./deployment/goose/migrations:/migrations:ro
    command: ["-env=none", "up"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ==========
  # GOLANG
  # ==========
  backend:
    image: golang:1.27.1-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - go_modules:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    command: ["go", "run", "./cmd/api"]
    expose:
      - "8080"
    environment:
      PORT: ":8080"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      MONETIZATION_ENABLED: ${MONETIZATION_ENABLED:-false}
      ADSENSE_CLIENT_ID: ${ADSENSE_CLIENT_ID:-}
      ADSENSE_FEED_ENABLED: ${ADSENSE_FEED_ENABLED:-false}
      ADSENSE_FEED_SLOT_ID: ${ADSENSE_FEED_SLOT_ID:-}
      ADSENSE_FEED_FORMAT: ${ADSENSE_FEED_FORMAT:-fluid}
      ADSENSE_FEED_LAYOUT_KEY: ${ADSENSE_FEED_LAYOUT_KEY:-}
      ADSENSE_FEED_FIRST_AFTER_POSTS: ${ADSENSE_FEED_FIRST_AFTER_POSTS:-5}
      ADSENSE_FEED_REPEAT_EVERY_POSTS: ${ADSENSE_FEED_REPEAT_EVERY_POSTS:-8}
      ADSENSE_FEED_MAXIMUM_ADS: ${ADSENSE_FEED_MAXIMUM_ADS:-3}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ==========
  # NGINX
  # ==========
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  go_modules:
  go_build_cache:
