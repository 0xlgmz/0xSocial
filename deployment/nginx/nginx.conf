server {
    listen 443;
    server_name www.0xsocial.co.uk 0xsocial.co.uk;

    root /usr/share/nginx/html;
    index index.html;

    # Crawler-facing files must never fall through to the SPA shell. A missing
    # file should return 404 instead of a misleading index.html response.
    location = /ads.txt {
        default_type text/plain;
        try_files /ads.txt =404;
    }

    location = /robots.txt {
        default_type text/plain;
        try_files /robots.txt =404;
    }

    location /api/ {
        # No trailing slash means the /api/ prefix is preserved.
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Replace rather than trust an incoming proxy chain.
        proxy_set_header X-Forwarded-For $remote_addr;

        # The application should not consume this directly.
        proxy_set_header CF-Connecting-IP "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
